function resizeCanvas(){
  const ratio=W/H;

  if(cw/ch>ratio){cw=ch*ratio;}else{ch=cw/ratio;}
  canvas.style.width=cw+'px';canvas.style.height=ch+'px';
}

// Audio
const AC=new(window.AudioContext||window.webkitAudioContext)();
function playSound(freq,dur,type='square',vol=0.15){
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(AC.destination);
  o.start();o.stop(AC.currentTime+dur);
}
function sfxJump(){playSound(400,0.15);playSound(600,0.1);}
function sfxLand(){playSound(200,0.08,'sine',0.1);}
function sfxDeath(){playSound(200,0.3,'sawtooth',0.2);setTimeout(()=>playSound(100,0.4,'sawtooth',0.15),100);}
function sfxCheckpoint(){playSound(880,0.3,'sine',0.1);}
function sfxWin(){[0,100,200,300,400].forEach((d,i)=>setTimeout(()=>playSound(500+i*100,0.2,'sine',0.15),d));}

// Preview system: temporarily show an item on the character without equipping
let previewItem=null; // {cat, id} or null
let previewEquipped=null; // snapshot of equipped with preview applied

function getPreviewEquipped(){
  if(!previewItem)return equipped;
  const pe={...equipped};
  const cat=previewItem.cat;
  if(cat==='Hats')pe.hat=previewItem.id;
  else if(cat==='Colors')pe.color=previewItem.id;
  else if(cat==='Faces')pe.face=previewItem.id;
  else if(cat==='Pets')pe.pet=previewItem.id;
  return pe;
}

// Save/load
function saveProgress(){
  const data={coins,moons,equipped,owned:{},touchedCPs:Array.from(state.touchedCPs)};
  for(const cat of SHOP_CATS)shopItems[cat].forEach(it=>{if(it.owned)data.owned[it.id]=true;});
  try{localStorage.setItem('kery_obby_save',JSON.stringify(data));}catch(e){}
}
function loadProgress(){
  try{
    const raw=localStorage.getItem('kery_obby_save');
    if(!raw)return;
    const data=JSON.parse(raw);
    coins=data.coins||0;
    moons=data.moons||0;
    if(data.equipped)equipped={...equipped,...data.equipped};
    if(data.owned)for(const cat of SHOP_CATS)shopItems[cat].forEach(it=>{if(data.owned[it.id])it.owned=true;});
    if(data.touchedCPs&&Array.isArray(data.touchedCPs)){window._loadedCPs=new Set(data.touchedCPs);}
  }catch(e){}
}
loadProgress();

// Generate coins for each level
function generateLevelCoins(lvIndex){
  const lv=getLevel(lvIndex);
  if(Array.isArray(lv.coinPath)){
    return lv.coinPath.map(c=>({x:c.x,y:c.y,w:16,h:16,collected:false}));
  }
  const lvCoins=[];
  lv.platforms.forEach((pl,i)=>{
    if(i>0&&((i*7+lvIndex*13)%10)<6){
      lvCoins.push({x:pl.x+pl.w/2-8,y:pl.y-30,w:16,h:16,collected:false});
    }
  });
  // Extra coins between platforms (floating)
  for(let i=1;i<lv.platforms.length-1;i+=2){
    const p1=lv.platforms[i],p2=lv.platforms[i+1];
    if(p2){
      const mx=(p1.x+p1.w+p2.x)/2;
      const my=Math.min(p1.y,p2.y)-40;
      lvCoins.push({x:mx,y:my,w:16,h:16,collected:false});
    }
  }
  return lvCoins;
}

function generateLevelMoons(lvIndex){
  const lv=getLevel(lvIndex);
  const plats=lv.platforms||[];
  if(plats.length<2)return [];
  const pl=plats[Math.max(1,plats.length-2)];
  return [{x:pl.x+pl.w/2-10,y:pl.y-38,w:20,h:20,collected:false}];
}

function seededRandom(seed){
  let s=seed;
  return function(){s=(s*16807+0)%2147483647;return(s-1)/2147483646;};
}

function generateLevel(lvIndex){
  const diff=Math.min(lvIndex-2,15); // difficulty 1-15
  const rand=seededRandom(lvIndex*7919+42);
  const theme=THEMES[(lvIndex-3)%THEMES.length];
  const numPlats=8+Math.floor(diff*1.5);
  const levelWidth=1200+diff*150;
  
  const platforms=[];
  let px=0,py=500;
  // Starting platform
  platforms.push({x:0,y:500,w:180,h:40,color:theme.colors[0]});
  
  for(let i=1;i<numPlats;i++){
    const baseGap=80+rand()*80+diff*5;
    const gap=i<=2?Math.min(baseGap,120):baseGap;
    const dy=i<=2?(rand()-0.3)*50:(rand()-0.5)*80;
    px+=gap+60+rand()*60;
    py=Math.max(250,Math.min(520,py+dy));
    const w=50+rand()*80-diff*2;
    platforms.push({x:px,y:py,w:Math.max(40,w),h:40,color:theme.colors[i%theme.colors.length]});
  }
  // Finish platform (wider, gold)
  const finX=px+120+rand()*60;
  const finY=py-(rand()*40);
  platforms.push({x:finX,y:finY,w:200,h:40,color:'#FFD700'});

  // Lava
  const lava=[{x:180,y:560,w:finX+400,h:40}];

  // Moving platforms (more with difficulty)
  const moving=[];
  const numMoving=Math.min(1+Math.floor(diff*0.7),8);
  for(let i=0;i<numMoving;i++){
    const mp=platforms[2+Math.floor(rand()*(platforms.length-3))];
    if(!mp)continue;
    const axis=rand()>0.5?'x':'y';
    const range=60+rand()*80;
    const speed=0.8+rand()*0.8+diff*0.1;
    if(axis==='x'){
      moving.push({x:mp.x,y:mp.y-20,w:80,h:20,color:'#FF9F43',sx:mp.x-range/2,ex:mp.x+range/2,speed,axis:'x'});
    }else{
      moving.push({x:mp.x+20,y:mp.y,w:70,h:20,color:'#9B59B6',sy:mp.y-range,ey:mp.y+20,speed,axis:'y'});
    }
  }

  // Spinning obstacles (start at level 6+, easier at first)
  const spinning=[];
  if(diff>=4){
    const numSpin=Math.min(Math.floor((diff-3)*0.5),6);
    for(let i=0;i<numSpin;i++){
      const sp=platforms[3+Math.floor(rand()*(platforms.length-4))];
      if(!sp)continue;
      spinning.push({x:sp.x+sp.w/2,y:sp.y-30,r:rand()*Math.PI*2,speed:1+rand()*0.5+diff*0.08,color:'#E74C3C',armW:40+diff*2,armH:10});
    }
  }

  // Checkpoints (every ~4-5 platforms)
  const checkpoints=[];
  for(let i=4;i<platforms.length-1;i+=3+Math.floor(rand()*2)){
    checkpoints.push({x:platforms[i].x+platforms[i].w/2,y:platforms[i].y-40});
  }

  // Neon City checkpoint 2: extra landing so the lava gap is jumpable
  if(theme.name==='Neon City'){
    if(checkpoints.length<2&&platforms.length>5){
      const p=platforms[Math.min(6,platforms.length-2)];
      checkpoints.push({x:p.x+p.w/2,y:p.y-40});
    }
    if(checkpoints[1]){
      const cp=checkpoints[1];
      platforms.splice(platforms.length-1,0,{
        x:cp.x+45,y:cp.y+28,w:100,h:40,color:theme.colors[2]
      });
    }
  }

  return{
    name:`Stage ${lvIndex+1}: ${theme.name}`,
    platforms,lava,moving,spinning,checkpoints,
    finish:{x:finX+100,y:finY-40},
    theme
  };
}

  // Stage 10 always. Extra boss arenas at 6, 14, 22, 28...
  if(idx===9)return true;
  if(idx<5||AUTHORED_LEVELS[idx])return false;
  return idx%8===5;
}

// Cache generated levels
const generatedLevels={};
function getLevel(idx){
  if(idx<3)return levels[idx];
  if(AUTHORED_LEVELS[idx])return AUTHORED_LEVELS[idx];
  if(!generatedLevels[idx])generatedLevels[idx]=isBossStage(idx)?generateBossLevel(idx):generateLevel(idx);
  return generatedLevels[idx];
}
function bossIsDown(){
  return !state.boss||state.boss.hp<=0;
}
function ensureBoss(lv){
  if(!lv.isBoss){state.boss=null;state.bossShots=[];return;}
  if(state.boss&&state.boss.level===state.currentLevel)return;
  state.boss={
    level:state.currentLevel,kind:lv.bossKind,
    x:520,y:430,w:56,h:70,vx:1.8,vy:0,facing:1,
    hp:lv.bossHp,maxHp:lv.bossHp,hurt:0,grounded:true,jumpT:0,shootT:0
  };
  state.bossShots=[];
}
function updateBoss(p,lv,dt){
  const b=state.boss;
  if(!b||b.hp<=0){
    state.bossShots=state.bossShots.filter(s=>{s.life-=dt;return s.life>0;});
    return false;
  }
  if(b.hurt>0)b.hurt--;
  b.vy+=0.45;b.x+=b.vx;b.y+=b.vy;
  if(b.y+b.h>500){b.y=500-b.h;b.vy=0;b.grounded=true;}
  if(b.x<20){b.x=20;b.vx=Math.abs(b.vx);b.facing=1;}
  if(b.x+b.w>880){b.x=880-b.w;b.vx=-Math.abs(b.vx);b.facing=-1;}
  if(b.kind==='hopper'&&b.grounded){
    b.vx*=0.86;
    b.jumpT+=dt;
    if(b.jumpT>1.05){
      b.vy=-11;b.grounded=false;b.jumpT=0;
      b.vx=(p.x>b.x?1:-1)*2.3;b.facing=b.vx>=0?1:-1;
    }
  }else if(b.kind==='charger'){
    b.vx+=(p.x>b.x?1:-1)*0.09;
    b.vx=Math.max(-3.4,Math.min(3.4,b.vx));
    b.facing=b.vx>=0?1:-1;
  }else if(b.kind==='shooter'){
    b.vx=Math.sin(state.time*0.9)*1.5;
    b.facing=p.x>b.x?1:-1;
    b.shootT+=dt;
    if(b.shootT>1.35){
      b.shootT=0;
      state.bossShots.push({x:b.x+b.w/2,y:b.y+24,vx:b.facing*4.2,vy:-1.6,life:2.8});
    }
  }
  for(const s of state.bossShots){
    s.x+=s.vx;s.y+=s.vy;s.vy+=0.16;s.life-=dt;
    if(s.x>p.x&&s.x<p.x+p.w&&s.y>p.y&&s.y<p.y+p.h)return true;
  }
  state.bossShots=state.bossShots.filter(s=>s.life>0&&s.y<580);
  if(rectCollide({x:p.x,y:p.y,w:p.w,h:p.h},b)){
    const fromAbove=p.vy>1&&(p.y+p.h)<b.y+b.h*0.5;
    if(fromAbove&&b.hurt===0){
      b.hp--;b.hurt=22;p.vy=-11;sfxHit();
      spawnParticles(b.x+b.w/2,b.y,'#FFD700',14,7);
      spawnParticles(b.x+b.w/2,b.y,'#E74C3C',10,6);
      if(b.hp<=0){
        const bonus=20+state.currentLevel*4;
        coins+=bonus;saveProgress();
        showLevelFlash('BOSS DOWN! +'+bonus+'🪙');
        sfxWin();
        spawnParticles(b.x+b.w/2,b.y+20,'#FFD700',28,10);
      }
    }else if(!fromAbove){
      return true;
    }
  }
  return false;
}

function getPlayerColor(t){
  const ci=shopItems.Colors.find(c=>c.id===equipped.color);
  if(!ci)return'#FF6B6B';
  if(ci.color==='rainbow')return`hsl(${(t*60)%360},80%,60%)`;
  if(ci.color==='galaxy'){
    const h=(t*20)%360;
    return`hsl(${240+40*Math.sin(t)},70%,${30+20*Math.sin(t*2)}%)`;
  }
  return ci.color;
}

function spawnParticles(x,y,color,count,spread){
  for(let i=0;i<count;i++){
    state.particles.push({x,y,vx:(Math.random()-0.5)*spread,vy:-Math.random()*spread*0.7,life:1,color,size:3+Math.random()*4});
  }
}

function resetPlayer(toCheckpoint){
  const p=state.player;
  if(toCheckpoint){
    p.x=state.checkpoint.x;p.y=state.checkpoint.y-50;
    state.currentLevel=state.checkpoint.level;
  }else{
    p.x=50;p.y=400;state.currentLevel=0;
    state.checkpoint={x:50,y:400,level:0};
  }
  p.vx=0;p.vy=0;p.grounded=false;
}

function startGame(){
  if(AC.state==='suspended')AC.resume();
  state.mode=MODES.PLAY;
  state.deaths=0;state.time=0;
  state.currentLevel=0;
  state.boss=null;state.bossShots=[];
  state.checkpoint={x:50,y:400,level:0};
  state.touchedCPs=new Set();
  // Generate coins for first few levels (more generated on the fly)
  state.levelCoins=[];
  state.levelMoons=[];
  for(let i=0;i<5;i++){
    state.levelCoins[i]=generateLevelCoins(i);
    state.levelMoons[i]=generateLevelMoons(i);
  }
  resetPlayer(false);
  showLevelFlash(levels[0].name);
}

function showLevelFlash(text){state.levelFlash=120;state.levelFlashText=text;}

function completeLevel(skipped){
  const p=state.player;
  if(!skipped){
    const stageBonus=5+state.currentLevel*3;
    coins+=stageBonus;
    moons+=1;
  }
  saveProgress();
  if((state.currentLevel+1)%5===0){
    win();
    return;
  }
  state.currentLevel++;
  if(!state.levelCoins[state.currentLevel])state.levelCoins[state.currentLevel]=generateLevelCoins(state.currentLevel);
  if(!state.levelMoons[state.currentLevel])state.levelMoons[state.currentLevel]=generateLevelMoons(state.currentLevel);
  p.x=50;p.y=400;p.vx=0;p.vy=0;
  state.checkpoint={x:50,y:400,level:state.currentLevel};
  const nl=getLevel(state.currentLevel);
  showLevelFlash(skipped?('SKIP → '+nl.name):(nl.name+' (+'+(5+(state.currentLevel-1)*3)+'🪙)'));
  sfxCheckpoint();
  spawnParticles(p.x+15,p.y+18,'#FFD700',15,6);
}

function trySkipLevel(){
  if(state.mode!==MODES.PLAY)return;
  if(moons<SKIP_COST){
    sfxLocked();
    showLevelFlash('Need 🌙 '+SKIP_COST+' moons');
    return;
  }
  moons-=SKIP_COST;
  saveProgress();
  sfxBuy();
  completeLevel(true);
}

function die(){
  sfxDeath();state.deaths++;
  spawnParticles(state.player.x+15,state.player.y+18,'#FF6B6B',20,8);
  spawnParticles(state.player.x+15,state.player.y+18,'#FFD700',10,6);
  state.mode=MODES.DEAD;state.deadTimer=60;
}

function win(){
  sfxWin();
  // Bonus coins for milestone!
  const bonus=Math.max(20,100-state.deaths*2);
  coins+=bonus;
  saveProgress();
  state.mode=MODES.WIN;state.winBonus=bonus;state.winStage=state.currentLevel+1;
  spawnParticles(state.player.x+15,state.player.y+18,'#FFD700',30,10);
}

function rectCollide(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;}

function update(dt){
  if(state.mode===MODES.MENU||state.mode===MODES.WIN||state.mode===MODES.SHOP)return;
  if(state.mode===MODES.DEAD){
    state.deadTimer--;
    if(state.deadTimer<=0){state.mode=MODES.PLAY;resetPlayer(true);}
    updateParticles(dt);return;
  }
  state.time+=dt;
  if(state.levelFlash>0)state.levelFlash--;

  const p=state.player;
  const lv=getLevel(state.currentLevel);
  ensureBoss(lv);
  const gravity=0.6;const friction=0.85;

  let inputX=0;
  if(keys['ArrowLeft']||keys['KeyA']||touchLeft)inputX=-1;
  if(keys['ArrowRight']||keys['KeyD']||touchRight)inputX=1;
  if(inputX!==0)p.facing=inputX;
  p.vx+=inputX*1.2;
  if((keys['Space']||keys['ArrowUp']||keys['KeyW']||touchJump)&&p.grounded){
    p.vy=-12;p.grounded=false;sfxJump();
    spawnParticles(p.x+15,p.y+p.h,'#ffffff',5,3);
  }

  p.vx*=friction;p.vy+=gravity;
  p.x+=p.vx;p.y+=p.vy;
  p.grounded=false;

  const allPlats=[...lv.platforms];
  lv.moving.forEach(m=>{
    if(m.axis==='x')m.x=m.sx+(m.ex-m.sx)*(0.5+0.5*Math.sin(state.time*m.speed));
    else m.y=m.sy+(m.ey-m.sy)*(0.5+0.5*Math.sin(state.time*m.speed));
    allPlats.push(m);
  });

  lv.spinning.forEach(s=>{s.r+=s.speed*dt;});

  for(const pl of allPlats){
    if(rectCollide({x:p.x,y:p.y,w:p.w,h:p.h},pl)){
      const ob=p.y+p.h-pl.y,ot=pl.y+pl.h-p.y,ol=p.x+p.w-pl.x,or2=pl.x+pl.w-p.x;
      const mn=Math.min(ob,ot,ol,or2);
      if(mn===ob&&p.vy>0){p.y=pl.y-p.h;p.vy=0;p.grounded=true;if(!p.wasGrounded){sfxLand();spawnParticles(p.x+15,p.y+p.h,'#ffffff',3,2);}}
      else if(mn===ot&&p.vy<0){p.y=pl.y+pl.h;p.vy=0;}
      else if(mn===ol){p.x=pl.x-p.w;p.vx=0;}
      else if(mn===or2){p.x=pl.x+pl.w;p.vx=0;}
    }
  }
  p.wasGrounded=p.grounded;

  for(const s of lv.spinning){
    for(let a=0;a<2;a++){
      const ang=s.r+a*Math.PI;
      for(let d=-s.armW/2;d<=s.armW/2;d+=8){
        const ox=s.x+Math.cos(ang)*d,oy=s.y+Math.sin(ang)*d;
        if(ox>p.x&&ox<p.x+p.w&&oy>p.y&&oy<p.y+p.h){die();return;}
      }
    }
  }

  for(const l of lv.lava){if(rectCollide({x:p.x,y:p.y,w:p.w,h:p.h},l)){die();return;}}
  if(p.y>650){die();return;}
  if(updateBoss(p,lv,dt)){die();return;}

  // Coin collection
  if(state.levelCoins[state.currentLevel]){
    state.levelCoins[state.currentLevel].forEach(c=>{
      if(!c.collected&&rectCollide({x:p.x,y:p.y,w:p.w,h:p.h},c)){
        c.collected=true;coins+=5;sfxCoin();
        spawnParticles(c.x+8,c.y+8,'#FFD700',8,4);
        saveProgress();
      }
    });
  }

  lv.checkpoints.forEach(cp=>{
    const cpKey=state.currentLevel+'-'+cp.x+'-'+cp.y;
    if(Math.hypot(p.x+15-cp.x,p.y+18-cp.y)<60&&!state.touchedCPs.has(cpKey)){
      state.checkpoint={x:cp.x,y:cp.y-50,level:state.currentLevel};
      state.touchedCPs.add(cpKey);
      sfxCheckpoint();spawnParticles(cp.x,cp.y,'#4ECDC4',15,6);
    }
  });

  const fin=lv.finish;
  if(lv.isBoss&&!bossIsDown()){/* flag locked until the boss is down */}
  else if(Math.hypot(p.x+15-fin.x,p.y+18-fin.y)<50){
    completeLevel(false);
    return;
  }

  state.camera.x+=(p.x-300-state.camera.x)*0.08;
  state.camera.y+=(p.y-350-state.camera.y)*0.05;
  updateParticles(dt);
}

function updateParticles(dt){
  state.particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=0.3;p.life-=0.02;p.size*=0.98;});
  state.particles=state.particles.filter(p=>p.life>0);
}

function drawPlayerChar(sx,sy,scale,t,eqOverride){
  const s=scale||1;
  const eq=eqOverride||equipped;
  ctx.save();
  ctx.translate(sx,sy);
  ctx.scale(s,s);

  const tt=t||state.time;
  // Get color from eq override
  const ci=shopItems.Colors.find(c=>c.id===eq.color);
  let pColor='#FF6B6B';
  if(ci){
    if(ci.color==='rainbow')pColor=`hsl(${(tt*60)%360},80%,60%)`;
    else if(ci.color==='galaxy')pColor=`hsl(${240+40*Math.sin(tt)},70%,${30+20*Math.sin(tt*2)}%)`;
    else pColor=ci.color;
  }

  // Body
  ctx.fillStyle=pColor;
  if(eq.color==='col_galaxy'){
    const grd=ctx.createLinearGradient(4,10,26,28);
    grd.addColorStop(0,'#1a0533');grd.addColorStop(0.5,'#4A0E82');grd.addColorStop(1,'#1a0533');
    ctx.fillStyle=grd;
  }
  ctx.fillRect(4,10,22,18);

  // Head
  ctx.fillStyle='#FFD4A6';
  ctx.fillRect(6,0,18,14);

  // Face
  const face=eq.face;
  if(face==='face_normal'||face==='face_happy'){
    ctx.fillStyle='#333';
    ctx.fillRect(10,4,4,4);ctx.fillRect(18,4,4,4);
    if(face==='face_happy'){ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.beginPath();ctx.arc(16,10,4,0,Math.PI);ctx.stroke();}
    else{ctx.fillRect(12,10,8,2);}
  }else if(face==='face_cool'){
    ctx.fillStyle='#333';ctx.fillRect(8,3,16,6);
    ctx.fillStyle='#111';ctx.fillRect(9,4,6,4);ctx.fillRect(17,4,6,4);
    ctx.fillRect(15,5,2,2);
    ctx.fillStyle='#333';ctx.fillRect(12,10,8,2);
  }else if(face==='face_uwu'){
    ctx.fillStyle='#E74C3C';
    // Closed happy eyes
    ctx.lineWidth=1.5;ctx.strokeStyle='#333';
    ctx.beginPath();ctx.arc(12,5,3,0,Math.PI,true);ctx.stroke();
    ctx.beginPath();ctx.arc(20,5,3,0,Math.PI,true);ctx.stroke();
    // Small w mouth
    ctx.beginPath();ctx.moveTo(11,10);ctx.quadraticCurveTo(13,13,15,10);ctx.quadraticCurveTo(17,13,19,10);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();
  }else if(face==='face_star'){
    ctx.fillStyle='#FFD700';
    [11,19].forEach(cx=>{
      ctx.beginPath();
      for(let i=0;i<5;i++){
        const a=Math.PI*2*i/5-Math.PI/2;
        const r=i%2===0?3:1.5;
        ctx.lineTo(cx+Math.cos(a)*r,5+Math.sin(a)*r);
      }
      ctx.closePath();ctx.fill();
    });
    ctx.fillStyle='#333';ctx.fillRect(12,10,8,2);
  }else if(face==='face_blush'){
    ctx.fillStyle='#333';
    ctx.fillRect(10,4,4,4);ctx.fillRect(18,4,4,4);
    ctx.fillStyle='rgba(255,100,100,0.4)';
    ctx.beginPath();ctx.arc(9,9,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(23,9,3,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.arc(16,11,4,0,Math.PI);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();
  }else if(face==='face_wink'){
    ctx.fillStyle='#333';
    ctx.fillRect(10,4,4,4); // open eye
    ctx.lineWidth=1.5;ctx.strokeStyle='#333';ctx.beginPath();ctx.moveTo(17,6);ctx.lineTo(23,6);ctx.stroke(); // wink
    ctx.beginPath();ctx.arc(16,11,4,0,Math.PI);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();
  }else if(face==='face_angry'){
    ctx.fillStyle='#333';
    ctx.fillRect(10,5,4,3);ctx.fillRect(18,5,4,3);
    // Angry brows
    ctx.lineWidth=1.5;ctx.strokeStyle='#333';
    ctx.beginPath();ctx.moveTo(8,2);ctx.lineTo(15,4);ctx.stroke();
    ctx.beginPath();ctx.moveTo(24,2);ctx.lineTo(17,4);ctx.stroke();
    // Grr mouth
    ctx.fillRect(11,10,10,2);ctx.fillStyle='white';ctx.fillRect(13,10,2,2);ctx.fillRect(17,10,2,2);
  }else if(face==='face_heart'){
    // Heart-shaped eyes
    ctx.fillStyle='#E74C3C';
    [11,20].forEach(cx=>{
      ctx.beginPath();ctx.moveTo(cx,7);
      ctx.bezierCurveTo(cx-3,3,cx-5,6,cx,9);
      ctx.bezierCurveTo(cx+5,6,cx+3,3,cx,7);
      ctx.fill();
    });
    ctx.beginPath();ctx.arc(16,12,3,0,Math.PI);ctx.strokeStyle='#333';ctx.lineWidth=1;ctx.stroke();
  }else if(face==='face_catface'){
    ctx.fillStyle='#333';
    // Cat eyes (slitted)
    ctx.beginPath();ctx.ellipse(12,5,2.5,2,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(20,5,2.5,2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#4ECDC4';
    ctx.beginPath();ctx.ellipse(12,5,2,1.5,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(20,5,2,1.5,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#111';ctx.fillRect(11.5,4,1,3);ctx.fillRect(19.5,4,1,3);
    // Little cat nose + mouth
    ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.moveTo(15,9);ctx.lineTo(16,10);ctx.lineTo(17,9);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=0.8;
    ctx.beginPath();ctx.moveTo(16,10);ctx.lineTo(16,11);ctx.moveTo(14,11.5);ctx.quadraticCurveTo(16,13,16,11);ctx.moveTo(18,11.5);ctx.quadraticCurveTo(16,13,16,11);ctx.stroke();
    // Whiskers
    ctx.beginPath();ctx.moveTo(6,8);ctx.lineTo(12,9);ctx.moveTo(6,10);ctx.lineTo(12,10);ctx.moveTo(20,9);ctx.lineTo(26,8);ctx.moveTo(20,10);ctx.lineTo(26,10);ctx.stroke();
  }else if(face==='face_sleepy'){
    ctx.lineWidth=1.5;ctx.strokeStyle='#333';
    // Closed eyes
    ctx.beginPath();ctx.arc(12,6,3,0,Math.PI);ctx.stroke();
    ctx.beginPath();ctx.arc(20,6,3,0,Math.PI);ctx.stroke();
    // Open mouth (yawn)
    ctx.fillStyle='#333';ctx.beginPath();ctx.ellipse(16,11,3,2,0,0,Math.PI*2);ctx.fill();
    // Zzz
    ctx.fillStyle='rgba(100,100,255,0.6)';ctx.font='bold 7px sans-serif';ctx.textAlign='left';
    const zOff=Math.sin(tt*2)*2;
    ctx.fillText('z',24,-2+zOff);ctx.fillText('z',27,-6+zOff*0.7);
  }

  // Hat
  const hat=shopItems.Hats.find(h=>h.id===eq.hat);
  if(hat&&hat.draw)hat.draw(5,0,tt);

  // Legs
  ctx.fillStyle='#4A90D9';
  ctx.fillRect(6,28,8,8);ctx.fillRect(16,28,8,8);

  // Arms
  ctx.fillStyle=pColor;
  ctx.fillRect(0,12,6,12);ctx.fillRect(24,12,6,12);

  // Galaxy sparkles
  if(eq.color==='col_galaxy'){
    ctx.fillStyle='white';
    for(let i=0;i<4;i++){
      const sx2=6+Math.abs(Math.sin(tt*2+i*1.7))*18;
      const sy2=12+Math.abs(Math.cos(tt*1.5+i*2.3))*14;
      const sz=1+Math.sin(tt*3+i)*0.5;
      ctx.fillRect(sx2,sy2,sz,sz);
    }
  }

  ctx.restore();
}

function drawPet(sx,sy,t,eqOverride){
  const eq=eqOverride||equipped;
  const pet=shopItems.Pets.find(p=>p.id===eq.pet);
  if(pet&&pet.draw)pet.draw(sx,sy,t||state.time);
}

// Draw a mini preview thumbnail for a shop item
function drawItemThumb(ix,iy,item,cat,t){
  // Draw a tiny character with this item applied
  const thumbEq={...equipped};
  if(cat==='Hats')thumbEq.hat=item.id;
  else if(cat==='Colors')thumbEq.color=item.id;
  else if(cat==='Faces')thumbEq.face=item.id;
  else if(cat==='Pets')thumbEq.pet=item.id;
  
  ctx.save();
  // Draw mini character
  drawPlayerChar(ix,iy,0.8,t,thumbEq);
  if(cat==='Pets'){
    const pet=shopItems.Pets.find(p=>p.id===item.id);
    if(pet&&pet.draw)pet.draw(ix,iy,t);
  }
  ctx.restore();
}

function drawBg(){
  const grad=ctx.createLinearGradient(0,0,0,600);
  const lv=getLevel(state.currentLevel);
  if(lv.theme){
    grad.addColorStop(0,lv.theme.bg1);grad.addColorStop(1,lv.theme.bg2);
  }else if(state.currentLevel===0){grad.addColorStop(0,'#87CEEB');grad.addColorStop(1,'#E0F6FF');}
  else if(state.currentLevel===1){grad.addColorStop(0,'#F39C12');grad.addColorStop(1,'#FDEBD0');}
  else{grad.addColorStop(0,'#2C3E50');grad.addColorStop(1,'#4A6FA5');}
  ctx.fillStyle=grad;ctx.fillRect(0,0,800,600);
  ctx.fillStyle='rgba(255,255,255,0.3)';
  for(let i=0;i<5;i++){
    const cx=(i*200-state.camera.x*0.2+1000)%1000;
    ctx.beginPath();ctx.arc(cx,80+i*30,30,0,Math.PI*2);ctx.arc(cx+25,70+i*30,25,0,Math.PI*2);
    ctx.arc(cx-25,75+i*30,22,0,Math.PI*2);ctx.fill();
  }
}

function drawCoin(x,y,t){
  const bounce=Math.sin(t*3)*3;
  ctx.fillStyle='#FFD700';
  ctx.beginPath();ctx.arc(x+8,y+8+bounce,7,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#FFF8DC';
  ctx.beginPath();ctx.arc(x+6,y+6+bounce,2,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='#DAA520';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.arc(x+8,y+8+bounce,7,0,Math.PI*2);ctx.stroke();
}

// ===================== SHOP RENDERING =====================
function drawShop(){
  // Background
  const grad=ctx.createLinearGradient(0,0,0,600);
  grad.addColorStop(0,'#667eea');grad.addColorStop(1,'#764ba2');
  ctx.fillStyle=grad;ctx.fillRect(0,0,800,600);

  const t=Date.now()/1000;
  // Sparkles
  for(let i=0;i<20;i++){
    const sx2=Math.sin(t*0.3+i*1.7)*380+400;
    const sy2=Math.cos(t*0.4+i*2.3)*280+300;
    const a=0.2+0.15*Math.sin(t*2+i);
    ctx.fillStyle=`rgba(255,255,255,${a})`;
    ctx.beginPath();ctx.arc(sx2,sy2,1.5,0,Math.PI*2);ctx.fill();
  }

  // Title
  ctx.fillStyle='#FFD700';ctx.font='bold 36px "Segoe UI"';ctx.textAlign='center';
  ctx.fillText('✨ DRESS UP SHOP ✨',400,50);

  // Coin display
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.roundRect(620,15,170,40,20);ctx.fill();
  ctx.fillStyle='#FFD700';ctx.font='bold 20px "Segoe UI"';ctx.textAlign='right';
  ctx.fillText('🪙 '+coins,780,42);

  // Category tabs
  SHOP_CATS.forEach((cat,i)=>{
    const tx=80+i*175,ty=80;
    const active=i===shopCat;
    ctx.fillStyle=active?'rgba(255,255,255,0.3)':'rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.roundRect(tx,ty,150,36,18);ctx.fill();
    if(active){ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(tx,ty,150,36,18);ctx.stroke();}
    ctx.fillStyle=active?'#FFD700':'#ddd';ctx.font=`bold 16px "Segoe UI"`;ctx.textAlign='center';
    ctx.fillText(cat,tx+75,ty+24);
  });

  // Scroll arrows
  const items=shopItems[SHOP_CATS[shopCat]];
  const catName=SHOP_CATS[shopCat];
  const cols=2,itemW=340,itemH=90,startX=40,startY=140;
  const maxVisible=3; // max rows visible
  const totalRows=Math.ceil(items.length/cols);
  const maxScroll=Math.max(0,totalRows-maxVisible);
  if(shopScroll>maxScroll)shopScroll=maxScroll;

  // Scroll indicators
  if(shopScroll>0){
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 20px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText('▲ scroll up',400,133);
  }
  if(shopScroll<maxScroll){
    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='bold 20px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText('▼ scroll down',400,450);
  }

  ctx.save();
  ctx.beginPath();ctx.rect(0,startY-5,800,310);ctx.clip();

  items.forEach((item,i)=>{
    const col=i%cols,row=Math.floor(i/cols);
    const ix=startX+col*(itemW+20),iy=startY+(row-shopScroll)*(itemH+12);
    if(iy<startY-itemH||iy>startY+310)return; // off screen

    const isEquipped=(catName==='Hats'&&equipped.hat===item.id)||
      (catName==='Colors'&&equipped.color===item.id)||
      (catName==='Faces'&&equipped.face===item.id)||
      (catName==='Pets'&&equipped.pet===item.id);
    const isPreviewing=previewItem&&previewItem.id===item.id;

    // Card bg
    ctx.fillStyle=isEquipped?'rgba(78,205,196,0.4)':isPreviewing?'rgba(255,215,0,0.25)':item.owned?'rgba(255,255,255,0.15)':'rgba(0,0,0,0.3)';
    ctx.beginPath();ctx.roundRect(ix,iy,itemW,itemH,12);ctx.fill();

    if(isEquipped){ctx.strokeStyle='#4ECDC4';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(ix,iy,itemW,itemH,12);ctx.stroke();}
    if(isPreviewing){ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(ix,iy,itemW,itemH,12);ctx.stroke();}

    // Mini character thumbnail on the left
    const thumbX=ix+10,thumbY=iy+14;
    drawItemThumb(thumbX,thumbY,item,catName,t);

    // Item name + details on the right
    const textX=ix+55;
    if(item.vip&&!item.owned){
      ctx.fillStyle='#FFD700';ctx.font='bold 10px "Segoe UI"';ctx.textAlign='left';
      ctx.fillText('⭐ VIP',textX,iy+16);
    }
    ctx.fillStyle=item.owned||!item.vip?'white':'#ccc';
    ctx.font='bold 14px "Segoe UI"';ctx.textAlign='left';
    ctx.fillText(item.name,textX,iy+(item.vip&&!item.owned?34:28));

    // Cost or status
    if(!item.owned){
      ctx.fillStyle='#FFD700';ctx.font='bold 12px "Segoe UI"';ctx.textAlign='left';
      ctx.fillText('🪙 '+item.cost,textX,iy+itemH-14);
    }else if(isEquipped){
      ctx.fillStyle='#4ECDC4';ctx.font='bold 12px "Segoe UI"';ctx.textAlign='left';
      ctx.fillText('✓ WEARING',textX,iy+itemH-14);
    }else{

    }

    const btnX=ix+itemW-105,btnY=iy+12;
    // "Try On" / "Preview" button (always visible for unowned items)
    if(!isEquipped){
      ctx.fillStyle=isPreviewing?'rgba(255,215,0,0.7)':'rgba(255,255,255,0.2)';
      ctx.beginPath();ctx.roundRect(btnX,btnY,48,24,12);ctx.fill();
      ctx.fillStyle=isPreviewing?'#333':'#ddd';ctx.font='bold 10px "Segoe UI"';ctx.textAlign='center';
      ctx.fillText(isPreviewing?'👀 ON':'👀 Try',btnX+24,btnY+16);

      ctx.fillStyle=coins>=item.cost?'rgba(78,205,196,0.7)':'rgba(100,100,100,0.5)';
      ctx.beginPath();ctx.roundRect(btn2X,btn2Y,46,24,12);ctx.fill();
      ctx.fillStyle='white';ctx.font='bold 10px "Segoe UI"';ctx.textAlign='center';
      ctx.fillText(coins>=item.cost?'BUY':'🔒',btn2X+23,btn2Y+16);
    }else if(!isEquipped){
      ctx.fillStyle='rgba(78,205,196,0.7)';
      ctx.beginPath();ctx.roundRect(btn2X,btn2Y,46,24,12);ctx.fill();
      ctx.fillStyle='white';ctx.font='bold 10px "Segoe UI"';ctx.textAlign='center';
      ctx.fillText('WEAR',btn2X+23,btn2Y+16);
    }
  });
  ctx.restore(); // end clip region

  // Preview character (uses preview equipped if trying on)
  const previewEq=getPreviewEquipped();
  ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.roundRect(250,460,300,120,16);ctx.fill();
  if(previewItem){ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(250,460,300,120,16);ctx.stroke();}
  ctx.fillStyle=previewItem?'rgba(255,215,0,0.2)':'rgba(255,255,255,0.1)';
  ctx.beginPath();ctx.roundRect(250,460,300,20,{upperLeft:16,upperRight:16,lowerLeft:0,lowerRight:0});ctx.fill();
  ctx.fillStyle=previewItem?'#FFD700':'#ddd';ctx.font='bold 12px "Segoe UI"';ctx.textAlign='center';
  ctx.fillText(previewItem?'👀 TRYING ON: '+previewItem.name:'YOUR CHARACTER',400,476);
  drawPlayerChar(370,490,2.2,t,previewEq);
  drawPet(370,490,t,previewEq);

  // Back button
  ctx.fillStyle='rgba(231,76,60,0.8)';ctx.beginPath();ctx.roundRect(20,550,100,36,18);ctx.fill();
  ctx.fillStyle='white';ctx.font='bold 16px "Segoe UI"';ctx.textAlign='center';
  ctx.fillText('← Back',70,574);

  // VIP popup
  if(showVIPPopup&&vipPopupTimer>0){
    vipPopupTimer--;
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,0,800,600);
    ctx.fillStyle='rgba(40,40,60,0.95)';ctx.beginPath();ctx.roundRect(200,180,400,240,20);ctx.fill();
    ctx.strokeStyle='#FFD700';ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(200,180,400,240,20);ctx.stroke();

    ctx.fillText('⭐ VIP ITEM ⭐',400,225);

    ctx.fillText(vipPopupItem?vipPopupItem.name:'',400,265);
    ctx.fillStyle='#FFD700';ctx.font='bold 20px "Segoe UI"';
    ctx.fillText('Cost: 🪙 '+(vipPopupItem?vipPopupItem.cost:0),400,300);
    if(coins>=(vipPopupItem?vipPopupItem.cost:Infinity)){

      ctx.fillText('Play more levels to earn coins 🪙',400,375);
    }
    ctx.fillStyle='rgba(231,76,60,0.8)';ctx.beginPath();ctx.roundRect(410,330,120,45,22);ctx.fill();
    ctx.fillStyle='white';ctx.font='bold 18px "Segoe UI"';
    ctx.fillText('Cancel',470,360);
  }
}

function render(){
  ctx.clearRect(0,0,800,600);
  const t=Date.now()/1000;

  if(state.mode===MODES.SHOP){drawShop();return;}

  const lv=getLevel(state.currentLevel);

  if(state.mode===MODES.MENU){
    const grad=ctx.createLinearGradient(0,0,0,600);
    grad.addColorStop(0,'#667eea');grad.addColorStop(1,'#764ba2');
    ctx.fillStyle=grad;ctx.fillRect(0,0,800,600);

    // Sparkles
    for(let i=0;i<15;i++){
      const sx=Math.sin(t*0.5+i*1.3)*350+400;
      const sy=Math.cos(t*0.4+i*2.1)*250+300;
      ctx.fillStyle=`rgba(255,255,255,${0.15+0.1*Math.sin(t*2+i)})`;
      ctx.beginPath();ctx.arc(sx,sy,2,0,Math.PI*2);ctx.fill();
    }

    ctx.fillStyle='#FFD700';ctx.font='bold 56px "Segoe UI"';ctx.textAlign='center';
    const bounce=Math.sin(t*2)*8;
    ctx.fillText("🏃 KERY'S OBBY 🏃",400,180+bounce);

    // Coins display
    ctx.fillStyle='rgba(0,0,0,0.4)';ctx.beginPath();ctx.roundRect(320,210,160,32,16);ctx.fill();
    ctx.fillStyle='#FFD700';ctx.font='bold 18px "Segoe UI"';
    ctx.fillText('🪙 '+coins+' coins',400,232);

    // Character preview
    drawPlayerChar(375,260,2.5,t);
    drawPet(375,260,t);

    // Play button
    ctx.fillStyle='#4ECDC4';ctx.beginPath();ctx.roundRect(280,370,240,55,27);ctx.fill();
    ctx.fillStyle='white';ctx.font='bold 28px "Segoe UI"';
    ctx.fillText('▶ PLAY!',400,406);

    // Dress Up button
    ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.roundRect(280,440,240,55,27);ctx.fill();
    ctx.fillStyle='white';ctx.font='bold 24px "Segoe UI"';
    ctx.fillText('👗 DRESS UP',400,476);

    ctx.fillStyle='rgba(255,255,255,0.6)';ctx.font='14px "Segoe UI"';
    if(isMobile){
      ctx.fillText('◀ ▶ to move  |  ▲ to jump',400,530);
    }else{
      ctx.fillText('WASD / Arrows to move  |  SPACE to jump  |  F fullscreen',400,530);
    }
    ctx.fillText('Collect coins 🪙 to unlock VIP items!',400,555);
    return;
  }

  drawBg();

  // Platforms
  lv.platforms.forEach(pl=>{
    const x=pl.x-state.camera.x,y=pl.y-state.camera.y;
    ctx.fillStyle=pl.color;ctx.fillRect(x,y,pl.w,pl.h);
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.fillRect(x,y,pl.w,6);
    ctx.fillStyle='rgba(0,0,0,0.15)';ctx.fillRect(x,y+pl.h-6,pl.w,6);
  });

  lv.moving.forEach(m=>{
    const x=m.x-state.camera.x,y=m.y-state.camera.y;
    ctx.fillStyle=m.color;ctx.fillRect(x,y,m.w,m.h);
    ctx.fillStyle='rgba(255,255,255,0.4)';ctx.fillRect(x,y,m.w,4);
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font='12px sans-serif';ctx.textAlign='center';
    ctx.fillText(m.axis==='x'?'↔':'↕',x+m.w/2,y-5);
  });

  lv.spinning.forEach(s=>{
    const cx=s.x-state.camera.x,cy=s.y-state.camera.y;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(s.r);
    ctx.fillStyle=s.color;
    ctx.fillRect(-s.armW/2,-s.armH/2,s.armW,s.armH);
    ctx.fillRect(-s.armH/2,-s.armW/2,s.armH,s.armW);
    ctx.fillStyle='#333';ctx.beginPath();ctx.arc(0,0,8,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });

  lv.lava.forEach(l=>{
    const x=l.x-state.camera.x,y=l.y-state.camera.y;
    ctx.fillStyle='#FF4500';ctx.fillRect(x,y,l.w,l.h);
    ctx.fillStyle='#FF6B00';
    for(let i=0;i<l.w;i+=20){
      const bh=5+Math.sin((i+state.time*3))*5;
      ctx.fillRect(x+i,y-bh,10,bh);
    }
  });

  // Coins in level
  if(state.levelCoins[state.currentLevel]){
    state.levelCoins[state.currentLevel].forEach(c=>{
      if(!c.collected)drawCoin(c.x-state.camera.x,c.y-state.camera.y,state.time);
    });
  }

  lv.checkpoints.forEach(cp=>{
    const x=cp.x-state.camera.x,y=cp.y-state.camera.y;
    const cpKey=state.currentLevel+'-'+cp.x+'-'+cp.y;
    const reached=state.touchedCPs.has(cpKey);
    const flagColor=reached?'#2ECC40':'#FF3333';
    const poleColor=reached?'#2ECC40':'#AA2222';
    ctx.fillStyle=poleColor;
    ctx.fillRect(x-3,y-30,6,40);
    ctx.fillStyle=flagColor;
    ctx.beginPath();ctx.moveTo(x+3,y-30);ctx.lineTo(x+22,y-22);ctx.lineTo(x+3,y-14);ctx.fill();
    if(reached){ctx.fillStyle='rgba(46,204,64,'+(0.3+0.2*Math.sin(state.time*4))+')';ctx.beginPath();ctx.arc(x,y-15,15,0,Math.PI*2);ctx.fill();}
    else{ctx.fillStyle='rgba(255,51,51,'+(0.25+0.15*Math.sin(state.time*3))+')';ctx.beginPath();ctx.arc(x,y-15,18,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,'+(0.5+0.3*Math.sin(state.time*4))+')';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.fillText('⬇️',x+10,y-38+Math.sin(state.time*3)*3);}
  });

  const fin=lv.finish;
  if(!lv.isBoss||bossIsDown()){
    const fx=fin.x-state.camera.x,fy=fin.y-state.camera.y;
    ctx.fillStyle='#333';ctx.fillRect(fx-3,fy-40,6,50);
    ctx.fillStyle=state.currentLevel===levels.length-1?'#FFD700':'#4ECDC4';
    ctx.beginPath();ctx.moveTo(fx+3,fy-40);ctx.lineTo(fx+30,fy-30);ctx.lineTo(fx+3,fy-20);ctx.fill();
    ctx.fillStyle='rgba(255,215,0,'+(0.3+0.2*Math.sin(state.time*5))+')';
    ctx.beginPath();ctx.arc(fx,fy-25,20,0,Math.PI*2);ctx.fill();
  }else{
    const fx=fin.x-state.camera.x,fy=fin.y-state.camera.y;
    ctx.fillStyle='rgba(80,80,80,0.5)';ctx.fillRect(fx-3,fy-40,6,50);
    ctx.fillStyle='#888';ctx.font='bold 11px \"Segoe UI\"';ctx.textAlign='center';
    ctx.fillText('LOCKED',fx+8,fy-48);
  }

  // Boss
  if(lv.isBoss&&state.boss){
    const b=state.boss;
    const bx=b.x-state.camera.x,by=b.y-state.camera.y;
    if(b.hp>0){
      ctx.save();
      if(b.facing===-1){ctx.translate(bx+b.w/2,0);ctx.scale(-1,1);ctx.translate(-bx-b.w/2,0);}
      ctx.globalAlpha=b.hurt>0&&Math.floor(state.time*20)%2===0?0.45:1;
      ctx.fillStyle=b.kind==='shooter'?'#C0392B':b.kind==='charger'?'#8E44AD':'#E67E22';
      ctx.fillRect(bx+4,by+16,b.w-8,b.h-16);
      ctx.fillStyle='#FFD4A6';ctx.fillRect(bx+10,by,b.w-20,20);
      ctx.fillStyle='#111';ctx.fillRect(bx+16,by+6,6,6);ctx.fillRect(bx+b.w-22,by+6,6,6);
      ctx.fillStyle='#E74C3C';ctx.fillRect(bx+18,by+14,b.w-36,3);
      if(b.kind==='shooter'){
        ctx.fillStyle='#FF4500';ctx.fillRect(bx+b.w-10,by+22,12,8);
      }
      ctx.restore();
      const barW=80,barX=bx+b.w/2-barW/2,barY=by-16;
      ctx.fillStyle='#111';ctx.fillRect(barX,barY,barW,8);
      ctx.fillStyle='#E74C3C';ctx.fillRect(barX,barY,barW*(b.hp/b.maxHp),8);
      ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(barX,barY,barW,8);
      ctx.fillStyle='#FFD700';ctx.font='bold 11px \"Segoe UI\"';ctx.textAlign='center';
      ctx.fillText('BOSS',bx+b.w/2,barY-4);
    }
    state.bossShots.forEach(s=>{
      const sx=s.x-state.camera.x,sy=s.y-state.camera.y;
      ctx.fillStyle='#FF4500';ctx.beginPath();ctx.arc(sx,sy,7,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(sx-2,sy-2,3,0,Math.PI*2);ctx.fill();
    });
  }

  // Player
  if(state.mode!==MODES.DEAD){
    const p=state.player;
    const sx=p.x-state.camera.x,sy=p.y-state.camera.y;
    ctx.save();
    if(p.facing===-1){ctx.translate(sx+p.w/2,0);ctx.scale(-1,1);ctx.translate(-sx-p.w/2,0);}
    drawPlayerChar(sx,sy,1,state.time);
    drawPet(sx,sy,state.time);
    ctx.restore();
  }

  // Particles
  state.particles.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.color;
    ctx.fillRect(p.x-state.camera.x-p.size/2,p.y-state.camera.y-p.size/2,p.size,p.size);
  });
  ctx.globalAlpha=1;

  // HUD
  if(state.mode===MODES.PLAY||state.mode===MODES.DEAD){
    ctx.fillStyle='rgba(0,0,0,0.6)';
    ctx.beginPath();ctx.roundRect(10,10,140,36,18);ctx.fill();
    ctx.beginPath();ctx.roundRect(160,10,100,36,18);ctx.fill();
    ctx.beginPath();ctx.roundRect(270,10,110,36,18);ctx.fill();
    ctx.beginPath();ctx.roundRect(660,10,130,36,18);ctx.fill();
    ctx.fillStyle='white';ctx.font='bold 16px "Segoe UI"';ctx.textAlign='left';
    const mins=Math.floor(state.time/60),secs=Math.floor(state.time%60);
    ctx.fillText('⏱ '+mins+':'+(secs<10?'0':'')+secs,28,34);
    ctx.fillText('💀 '+state.deaths,178,34);
    ctx.fillText('🪙 '+coins,288,34);
    ctx.fillText('📍 Stage '+(state.currentLevel+1),678,34);
  }

  if(state.levelFlash>0){
    ctx.globalAlpha=Math.min(1,state.levelFlash/30);
    ctx.fillStyle='rgba(0,0,0,0.7)';ctx.beginPath();ctx.roundRect(200,260,400,60,30);ctx.fill();
    ctx.fillStyle='#FFD700';ctx.font='bold 24px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText(state.levelFlashText,400,298);
    ctx.globalAlpha=1;
  }

  // Mobile touch controls overlay
  if(isMobile&&(state.mode===MODES.PLAY||state.mode===MODES.DEAD)){
    ctx.globalAlpha=0.25;
    // Left zone
    ctx.fillStyle=touchLeft?'#4ECDC4':'#ffffff';
    ctx.beginPath();ctx.roundRect(20,H-110,100,80,16);ctx.fill();
    ctx.fillStyle=touchRight?'#4ECDC4':'#ffffff';
    ctx.beginPath();ctx.roundRect(140,H-110,100,80,16);ctx.fill();
    // Jump zone
    ctx.fillStyle=touchJump?'#FFD700':'#ffffff';
    ctx.beginPath();ctx.roundRect(W-130,H-110,110,80,16);ctx.fill();
    ctx.globalAlpha=0.6;
    ctx.fillStyle='#fff';ctx.font='bold 32px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText('◀',70,H-60);
    ctx.fillText('▶',190,H-60);
    ctx.fillText('▲',W-75,H-60);
    ctx.globalAlpha=1;
  }

  if(state.mode===MODES.DEAD){
    ctx.fillStyle='rgba(255,0,0,'+(0.2+0.1*Math.sin(state.deadTimer*0.3))+')';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle='white';ctx.font='bold 32px "Segoe UI"';ctx.textAlign='center';
    ctx.fillText('Oof! 💥',W/2,H/2);
  }

  if(state.mode===MODES.WIN){
    ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(0,0,800,600);
    ctx.fillStyle='#4ECDC4';ctx.font='bold 48px "Segoe UI"';ctx.textAlign='center';
    const bounce=Math.sin(t*2)*8;
    ctx.fillText('🎉 MILESTONE! 🎉',400,160+bounce);
    ctx.fillStyle='#FFD700';ctx.font='bold 28px "Segoe UI"';
    ctx.fillText('Stage '+(state.winStage||'?')+' Complete!',400,210);
    ctx.fillStyle='#FFD700';ctx.font='36px "Segoe UI"';
    ctx.fillText('⭐⭐⭐',400,255);
    ctx.fillStyle='#FFD700';ctx.font='bold 22px "Segoe UI"';
    ctx.fillText('+ '+(state.winBonus||0)+' bonus coins! 🪙',400,300);
    ctx.fillStyle='white';ctx.font='18px "Segoe UI"';
    const mins=Math.floor(state.time/60),secs=Math.floor(state.time%60);
    ctx.fillText('Time: '+mins+':'+(secs<10?'0':'')+secs+'  |  Deaths: '+state.deaths+'  |  🪙 '+coins,400,340);
    ctx.fillStyle='#4ECDC4';ctx.beginPath();ctx.roundRect(120,380,200,50,25);ctx.fill();
    ctx.fillStyle='white';ctx.font='bold 20px "Segoe UI"';
    ctx.fillText('KEEP GOING! →',220,412);
    ctx.fillStyle='#FF69B4';ctx.beginPath();ctx.roundRect(340,380,150,50,25);ctx.fill();
    ctx.fillStyle='white';ctx.font='bold 20px "Segoe UI"';
    ctx.fillText('👗 SHOP',415,412);
    ctx.fillStyle='rgba(255,255,255,0.3)';ctx.beginPath();ctx.roundRect(510,380,170,50,25);ctx.fill();
    ctx.fillStyle='white';ctx.font='bold 18px "Segoe UI"';
    ctx.fillText('🔄 Restart',595,412);
  }
}

// ===================== CLICK HANDLING =====================
canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const x=(e.clientX-rect.left)*(800/rect.width);
  const y=(e.clientY-rect.top)*(600/rect.height);

  if(state.mode===MODES.MENU){
    if(x>280&&x<520&&y>370&&y<425)startGame();
    if(x>280&&x<520&&y>440&&y<495){state.mode=MODES.SHOP;shopCat=0;}
  }

  if(state.mode===MODES.WIN){
    // Keep Going
    if(x>120&&x<320&&y>380&&y<430){
      state.currentLevel++;
      if(!state.levelCoins[state.currentLevel])state.levelCoins[state.currentLevel]=generateLevelCoins(state.currentLevel);
      state.player.x=50;state.player.y=400;state.player.vx=0;state.player.vy=0;
      state.checkpoint={x:50,y:400,level:state.currentLevel};
      state.mode=MODES.PLAY;
      const nl=getLevel(state.currentLevel);
      showLevelFlash(nl.name);sfxCheckpoint();
    }
    // Shop
    if(x>340&&x<490&&y>380&&y<430){state.mode=MODES.SHOP;shopCat=0;}
    // Restart
    if(x>510&&x<680&&y>380&&y<430)startGame();
  }

  if(state.mode===MODES.SHOP){
    // VIP popup handling
    if(showVIPPopup){
      if(vipPopupItem&&coins>=vipPopupItem.cost&&x>270&&x<390&&y>330&&y<375){
        // Buy!
        coins-=vipPopupItem.cost;
        vipPopupItem.owned=true;
        sfxBuy();
        saveProgress();
        showVIPPopup=false;
      }
      if(x>410&&x<530&&y>330&&y<375){showVIPPopup=false;}
      return;
    }

    // Back button
    if(x>20&&x<120&&y>550&&y<586){state.mode=MODES.MENU;return;}

    // Category tabs
    SHOP_CATS.forEach((cat,i)=>{
      const tx=80+i*175;
      if(x>tx&&x<tx+150&&y>80&&y<116){shopCat=i;shopScroll=0;previewItem=null;}
    });

    // Scroll up/down clicks
    if(y>120&&y<140&&shopScroll>0){shopScroll--;return;}
    const totalRows2=Math.ceil(shopItems[SHOP_CATS[shopCat]].length/2);
    if(y>440&&y<460&&shopScroll<Math.max(0,totalRows2-3)){shopScroll++;return;}

    // Item clicks
    const items=shopItems[SHOP_CATS[shopCat]];
    const catName2=SHOP_CATS[shopCat];
    const cols=2,itemW=340,itemH=90,startX=40,startY=140;
    items.forEach((item,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const ix=startX+col*(itemW+20),iy=startY+(row-shopScroll)*(itemH+12);
      if(iy<startY-itemH||iy>startY+310)return;

      const isEquipped=(catName2==='Hats'&&equipped.hat===item.id)||
        (catName2==='Colors'&&equipped.color===item.id)||
        (catName2==='Faces'&&equipped.face===item.id)||
        (catName2==='Pets'&&equipped.pet===item.id);

      // "Try On" button area
      const btnX=ix+itemW-105,btnY=iy+12;
      if(!isEquipped&&x>btnX&&x<btnX+48&&y>btnY&&y<btnY+24){
        // Toggle preview
        if(previewItem&&previewItem.id===item.id){
          previewItem=null; // un-preview
        }else{
          previewItem={cat:catName2,id:item.id,name:item.name};
        }
        sfxCoin();
        return;
      }

      // Buy/Equip button area
      const btn2X=ix+itemW-52,btn2Y=iy+12;
      if(x>btn2X&&x<btn2X+46&&y>btn2Y&&y<btn2Y+24){
        if(item.owned&&!isEquipped){
          // Equip
          if(catName2==='Hats')equipped.hat=item.id;
          else if(catName2==='Colors')equipped.color=item.id;
          else if(catName2==='Faces')equipped.face=item.id;
          else if(catName2==='Pets')equipped.pet=item.id;
          previewItem=null;
          sfxCheckpoint();saveProgress();
        }else if(!item.owned){
          if(coins>=item.cost){
            // Buy it
            showVIPPopup=true;vipPopupTimer=300;vipPopupItem=item;
          }else{
            sfxLocked();
            showVIPPopup=true;vipPopupTimer=300;vipPopupItem=item;
          }
        }
        return;
      }

      // Click anywhere else on card to preview
      if(x>ix&&x<ix+itemW&&y>iy&&y<iy+itemH){
        if(!isEquipped){
          if(previewItem&&previewItem.id===item.id){previewItem=null;}
          else{previewItem={cat:catName2,id:item.id,name:item.name};}
        }
      }
    });
  }
});

// Mouse wheel for shop scrolling
canvas.addEventListener('wheel',e=>{
  if(state.mode===MODES.SHOP&&!showVIPPopup){
    e.preventDefault();
    const totalRows=Math.ceil(shopItems[SHOP_CATS[shopCat]].length/2);
    const maxScroll=Math.max(0,totalRows-3);
    if(e.deltaY>0&&shopScroll<maxScroll)shopScroll++;
    else if(e.deltaY<0&&shopScroll>0)shopScroll--;
  }
},{passive:false});

// Keyboard
document.addEventListener('keydown',e=>{
  keys[e.code]=true;
  if(e.code==='KeyF'){
    if(!document.fullscreenElement)canvas.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  if(e.code==='Space')e.preventDefault();
  if(e.code==='Escape'&&state.mode===MODES.SHOP){state.mode=MODES.MENU;}
});
document.addEventListener('keyup',e=>{keys[e.code]=false;});

// Touch — improved for mobile
const touchIds={left:null,right:null,jump:null};
function handleTouchStart(e){
  e.preventDefault();
  if(AC.state==='suspended')AC.resume();
  const rect=canvas.getBoundingClientRect();
  for(const t of e.changedTouches){
    const x=(t.clientX-rect.left)*(W/rect.width);
    const y=(t.clientY-rect.top)*(H/rect.height);
    if(state.mode===MODES.MENU||state.mode===MODES.WIN||state.mode===MODES.SHOP){
      canvas.dispatchEvent(new MouseEvent('click',{clientX:t.clientX,clientY:t.clientY}));
      return;
    }
    // Mobile control zones matching visible buttons
    // Left arrow: 20-120, H-110 to H-30
    // Right arrow: 140-240, H-110 to H-30
    // Jump: W-130 to W-20, H-110 to H-30
    // Also support: left third of screen = left, right third = right, top half = jump (fallback)
    if(y>H-130){
      // Bottom row: precise button hits
      if(x<130){touchLeft=true;touchIds.left=t.identifier;}
      else if(x>130&&x<250){touchRight=true;touchIds.right=t.identifier;}
      if(x>W-140){touchJump=true;touchIds.jump=t.identifier;}
    }else{
      // Upper screen: left/right halves + tap to jump
      if(x<W*0.4){touchLeft=true;touchIds.left=t.identifier;}
      else if(x>W*0.6){touchRight=true;touchIds.right=t.identifier;}
      touchJump=true;touchIds.jump=t.identifier;
    }
  }
}
function handleTouchEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===touchIds.left){touchLeft=false;touchIds.left=null;}
    if(t.identifier===touchIds.right){touchRight=false;touchIds.right=null;}
    if(t.identifier===touchIds.jump){touchJump=false;touchIds.jump=null;}
  }
}
canvas.addEventListener('touchstart',handleTouchStart,{passive:false});
canvas.addEventListener('touchend',handleTouchEnd);
canvas.addEventListener('touchcancel',handleTouchEnd);

// Game loop
let lastTime=0;
function gameLoop(ts){
  const dt=Math.min((ts-lastTime)/1000,0.05);
  lastTime=ts;
  update(1/60);
  render();
  requestAnimationFrame(gameLoop);
}
requestAnimationFrame(gameLoop);

// Required hooks
window.render_game_to_text=function(){
  return JSON.stringify({
    mode:['MENU','PLAY','DEAD','WIN','SHOP'][state.mode],
    player:{x:Math.round(state.player.x),y:Math.round(state.player.y),vx:+state.player.vx.toFixed(2),vy:+state.player.vy.toFixed(2),grounded:state.player.grounded},
    level:state.currentLevel+1,deaths:state.deaths,time:+state.time.toFixed(1),coins:coins,
    equipped:equipped,
    checkpoint:{x:state.checkpoint.x,y:state.checkpoint.y},
    particles:state.particles.length
  });
};
window.advanceTime=function(ms){
  const steps=Math.max(1,Math.round(ms/(1000/60)));
  for(let i=0;i<steps;i++)update(1/60);
  render();
};
</script>
